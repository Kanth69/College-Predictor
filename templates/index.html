<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>KCET College Predictor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* ----- Global Styles ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: url('/static/ab.jpg') no-repeat center center fixed;
            background-size: cover;
            background-color: #d0f0fd; /* fallback */
            display: flex;
            flex-direction: column;
            overflow-x: hidden; /* prevent horizontal scrolling */
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(255,255,255,0.3); /* lighter overlay */
            z-index: -1;
        }

        a { text-decoration: none; }

        /* ----- Header & Navbar ----- */
        header {
            width: 100%;
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            padding: 15px 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-weight: bold;
            font-size: 20px;
            color: #1B4F72;
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            font-weight: bold;
            color: #1B4F72;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: #16A085;
        }

        /* ----- Main Container ----- */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95); /* light semi-transparent */
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 40px 35px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 450px;
            text-align: center;
            border: 1px solid rgba(200,200,200,0.3);
            color: #000;
        }

        h2 {
            font-size: 28px;
            margin-bottom: 25px;
            color: #1B4F72;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        label {
            font-weight: bold;
            text-align: left;
            font-size: 14px;
            color: #000;
        }

        input, select {
            padding: 12px;
            font-size: 15px;
            border-radius: 10px;
            border: 1px solid #ccc;
            outline: none;
            background: #f9f9f9;
            color: #000;
            transition: all 0.3s;
        }

        input::placeholder { color: #888; }

        input:focus, select:focus {
            border-color: #1B4F72;
            box-shadow: 0 0 10px rgba(26, 188, 156, 0.3);
        }

        button {
            padding: 14px;
            font-size: 16px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(45deg, #1ABC9C, #2E86C1);
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        button:hover {
            background: linear-gradient(45deg, #16A085, #1B4F72);
            transform: scale(1.05);
        }

        .note {
            font-size: 13px;
            color: #333;
            margin-top: 12px;
        }

        /* ----- Footer ----- */
        footer {
            width: 100%;
            padding: 15px 30px;
            text-align: center;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            color: #1B4F72;
            font-size: 13px;
        }

        @media (max-width: 480px) {
            .container { padding: 30px 20px; }
            .nav-links { gap: 15px; font-size: 14px; }
        }
    </style>
</head>
<body>

<header>
    <div class="navbar">
        <div class="logo">
            KCET Predictor
        </div>
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">CET Results</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </div>
    </div>
</header>

<main>
    <div class="container">
        <h2>KCET College Predictor</h2>
        <form method="POST">
            <label for="rank">Rank:</label>
            <input type="number" id="rank" name="rank" placeholder="Enter your KCET rank" required>

            <label for="branch">Branch:</label>
            <select id="branch" name="branch">
                <option value="CSE">CSE</option>
                <option value="ISE">ISE</option>
                <option value="ECE">ECE</option>
                <option value="EEE">EEE</option>
                <option value="MECH">MECH</option>
            </select>

            <label for="category">Category:</label>
            <select id="category" name="category">
                <option value="GM">GM</option>
                <option value="SC">SC</option>
                <option value="ST">ST</option>
                <option value="1">1</option>
                <option value="2A">2A</option>
                <option value="2B">2B</option>
                <option value="3A">3A</option>
                <option value="3B">3B</option>
            </select>

            <label for="round">Round:</label>
            <select id="round" name="round">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
            </select>

            <button type="submit">Find Eligible Colleges</button>
        </form>
        <p class="note">Enter your KCET details to see eligible colleges and official websites.</p>
    </div>
</main>

<footer>
    &copy; 2025 KCET Predictor | Designed by Srikanth K V
</footer>

</body>
</html>
